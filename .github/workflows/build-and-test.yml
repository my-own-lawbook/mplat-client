name: Build and Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build and Test

    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Execute gradle assemble
        run: ./gradlew assemble

      - name: Execute gradle check
        run: ./gradlew check

      - name: Run gradle sonar task
        env:
          SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
        run: ./gradlew sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=my-own-lawbook -Dsonar.projectKey=my-own-lawbook_mplat-client -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
